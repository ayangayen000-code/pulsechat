        <circle cx="80" cy="85" r="44" fill="url(#puppyGrad)" stroke="#d97706" stroke-width="3"/>
        <ellipse cx="80" cy="94" rx="18" ry="14" fill="#fef3c7"/>
        <ellipse cx="80" cy="88" rx="5" ry="3.5" fill="#1e293b"/>
        
        <circle cx="72" cy="74" r="3" fill="#1e293b"/>
        <circle cx="88" cy="74" r="3" fill="#1e293b"/>
        <path d="M72 84 Q80 80 88 84" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="58" y="96" width="44" height="15" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
        <text x="80" y="107" font-family="sans-serif" font-weight="900" font-size="9" fill="#334155" text-anchor="middle">BAD! 👎</text>
      
