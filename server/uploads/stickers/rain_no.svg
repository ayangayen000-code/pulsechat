<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Storm Cloud Body -->
        <circle cx="56" cy="74" r="22" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <circle cx="104" cy="74" r="22" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <circle cx="80" cy="62" r="28" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <rect x="52" y="70" width="56" height="28" rx="12" fill="url(#rainGrad)"/>
        <!-- Droplets -->
        <ellipse cx="60" cy="116" rx="4" ry="8" fill="#38bdf8"/>
        <ellipse cx="80" cy="122" rx="4" ry="8" fill="#38bdf8"/>
        <ellipse cx="100" cy="116" rx="4" ry="8" fill="#38bdf8"/>
        
        <line x1="68" y1="64" x2="78" y2="70" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="92" y1="64" x2="82" y2="70" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="72" y1="80" x2="88" y2="80" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="102" cy="90" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <line x1="97" y1="85" x2="107" y2="95" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="107" y1="85" x2="97" y2="95" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
      </g>
    
</svg>