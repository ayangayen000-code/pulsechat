<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="partyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f472b6"/>
        <stop offset="100%" stop-color="#ec4899"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Party Popper Cone / Mascot Body -->
        <circle cx="80" cy="82" r="44" fill="url(#partyGrad)" stroke="#be185d" stroke-width="3"/>
        <!-- Confetti Burst around -->
        <polygon points="76,32 80,18 84,32" fill="#facc15"/>
        <circle cx="34" cy="48" r="4" fill="#38bdf8"/>
        <circle cx="126" cy="48" r="4" fill="#4ade80"/>
        <rect x="36" y="112" width="8" height="8" fill="#facc15" transform="rotate(25 40 116)"/>
        <rect x="116" y="112" width="8" height="8" fill="#a855f7" transform="rotate(-25 120 116)"/>
        
        <path d="M100 46 A 10 10 0 1 0 104 62 A 8 8 0 0 1 100 46 Z" fill="#facc15"/>
        <path d="M66 78 Q72 82 78 78" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 78 Q88 82 94 78" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M75 86 Q80 89 85 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon points="62,54 64,58 68,59 65,61 66,65 62,62 58,65 59,61 56,59 60,58" fill="#facc15"/>
        <rect x="56" y="100" width="48" height="14" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
        <text x="80" y="111" font-family="sans-serif" font-weight="900" font-size="9" fill="#c7d2fe" text-anchor="middle">NIGHT 🌙</text>
      
      </g>
    
</svg>