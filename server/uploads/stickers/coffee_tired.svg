<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="greyCup" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#64748b"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <path d="M105 58 C126 58 126 92 105 92" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
        <rect x="42" y="42" width="68" height="72" rx="14" fill="url(#greyCup)" stroke="#475569" stroke-width="3"/>
        <ellipse cx="76" cy="44" rx="34" ry="10" fill="#334155"/>
        <!-- Tired Half-closed Eyes -->
        <path d="M56 70 L68 70" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M56 75 Q62 77 68 75" stroke="#64748b" stroke-width="2" fill="none"/>
        <path d="M84 70 L96 70" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M84 75 Q90 77 96 75" stroke="#64748b" stroke-width="2" fill="none"/>
        <!-- Dark circles -->
        <path d="M56 78 Q62 84 68 78" stroke="#334155" stroke-width="2" stroke-dasharray="2,2" fill="none"/>
        <path d="M84 78 Q90 84 96 78" stroke="#334155" stroke-width="2" stroke-dasharray="2,2" fill="none"/>
        <!-- Flat Mouth -->
        <line x1="70" y1="88" x2="82" y2="88" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <!-- ZZZ -->
        <text x="110" y="36" font-family="sans-serif" font-weight="900" font-size="20" fill="#64748b">Z</text>
        <text x="122" y="24" font-family="sans-serif" font-weight="900" font-size="15" fill="#94a3b8">z</text>
      </g>
    
</svg>