        <path d="M82 74 Q88 68 94 74" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="80" cy="84" rx="8" ry="5" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
        <circle cx="56" cy="50" r="2.5" fill="#facc15"/>
        <circle cx="104" cy="50" r="2.5" fill="#38bdf8"/>
