<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <path d="M52 82 Q58 78 64 80" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M68 80 Q74 78 80 82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="58" cy="86" r="3.5" fill="#1e293b"/>
        <circle cx="74" cy="86" r="3.5" fill="#1e293b"/>
        <path d="M58 96 Q66 90 74 96" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M54 92 C51 92 50 95 52 98 C54 100 57 100 58 98 C60 95 57 92 54 92 Z" fill="#38bdf8"/>
      
      </g>
    
</svg>