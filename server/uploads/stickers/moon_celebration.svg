<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <polygon points="58,60 66,40 74,60" fill="#ec4899" stroke="#be185d" stroke-width="1.5"/>
        <circle cx="66" cy="40" r="3" fill="#facc15"/>
        <path d="M52 82 Q58 76 64 82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M68 82 Q74 76 80 82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="66" cy="92" rx="8" ry="5" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
        <circle cx="42" cy="58" r="2.5" fill="#facc15"/>
        <circle cx="90" cy="58" r="2.5" fill="#38bdf8"/>
        <circle cx="38" cy="78" r="2" fill="#ec4899"/>
        <circle cx="94" cy="78" r="2" fill="#22c55e"/>
      
      </g>
    
</svg>