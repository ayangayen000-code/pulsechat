        <circle cx="102" cy="96" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <line x1="97" y1="91" x2="107" y2="101" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="107" y1="91" x2="97" y2="101" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
