<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Storm Cloud Body -->
        <circle cx="56" cy="74" r="22" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <circle cx="104" cy="74" r="22" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <circle cx="80" cy="62" r="28" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <rect x="52" y="70" width="56" height="28" rx="12" fill="url(#rainGrad)"/>
        <!-- Droplets -->
        <ellipse cx="60" cy="116" rx="4" ry="8" fill="#38bdf8"/>
        <ellipse cx="80" cy="122" rx="4" ry="8" fill="#38bdf8"/>
        <ellipse cx="100" cy="116" rx="4" ry="8" fill="#38bdf8"/>
        
        <polygon points="72,60 74,66 80,67 75,70 73,76 70,71 65,72 69,67 67,62 72,65" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
        <polygon points="88,60 90,66 96,67 91,70 89,76 86,71 81,72 85,67 83,62 88,65" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
        <ellipse cx="80" cy="81" rx="8" ry="6" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
        <circle cx="62" cy="74" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="98" cy="74" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="104" cy="52" r="3" fill="#f59e0b"/>
        <circle cx="56" cy="52" r="2" fill="#3b82f6"/>
      
      </g>
    
</svg>