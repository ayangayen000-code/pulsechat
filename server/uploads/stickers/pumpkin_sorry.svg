<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Stem -->
        <rect x="74" y="28" width="12" height="20" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2" transform="rotate(-6 80 38)"/>
        <!-- Pumpkin Ribs & Body -->
        <ellipse cx="50" cy="86" rx="28" ry="38" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="2.5"/>
        <ellipse cx="110" cy="86" rx="28" ry="38" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="2.5"/>
        <ellipse cx="80" cy="88" rx="34" ry="42" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="3"/>
        
        <circle cx="72" cy="80" r="4.5" fill="#1e293b"/>
        <circle cx="71" cy="78" r="1.5" fill="#ffffff"/>
        <circle cx="88" cy="80" r="4.5" fill="#1e293b"/>
        <circle cx="87" cy="78" r="1.5" fill="#ffffff"/>
        <path d="M74 90 Q80 86 86 90" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <rect x="56" y="102" width="48" height="15" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="80" y="113" font-family="sans-serif" font-weight="900" font-size="9" fill="#475569" text-anchor="middle">SORRY! 🥺</text>
      
      </g>
    
</svg>