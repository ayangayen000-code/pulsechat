<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <line x1="54" y1="78" x2="64" y2="84" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="78" y1="78" x2="68" y2="84" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="58" y1="94" x2="74" y2="94" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="88" cy="104" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <line x1="83" y1="99" x2="93" y2="109" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="93" y1="99" x2="83" y2="109" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
      </g>
    
</svg>