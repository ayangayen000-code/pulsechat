<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="bearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fcd34d"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Ears -->
        <circle cx="46" cy="50" r="16" fill="url(#bearGrad)" stroke="#b45309" stroke-width="3"/>
        <circle cx="46" cy="50" r="8" fill="#fecdd3"/>
        <circle cx="114" cy="50" r="16" fill="url(#bearGrad)" stroke="#b45309" stroke-width="3"/>
        <circle cx="114" cy="50" r="8" fill="#fecdd3"/>
        <!-- Head -->
        <circle cx="80" cy="85" r="44" fill="url(#bearGrad)" stroke="#b45309" stroke-width="3.5"/>
        <!-- Cream Muzzle -->
        <ellipse cx="80" cy="94" rx="16" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
        <polygon points="76,89 84,89 80,94" fill="#78350f"/>
        
        <line x1="68" y1="68" x2="78" y2="74" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="92" y1="68" x2="82" y2="74" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="72" y1="84" x2="88" y2="84" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="102" cy="94" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <line x1="97" y1="89" x2="107" y2="99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="107" y1="89" x2="97" y2="99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
      </g>
    
</svg>