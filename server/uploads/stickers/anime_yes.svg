        <circle cx="118" cy="85" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
        <rect x="110" y="50" width="16" height="28" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
