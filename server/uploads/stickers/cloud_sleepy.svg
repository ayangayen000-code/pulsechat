<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0f9ff"/>
        <stop offset="100%" stop-color="#bae6fd"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Rainbow arch behind -->
        <path d="M30 110 A 55 55 0 0 1 130 110" stroke="#f43f5e" stroke-width="4" fill="none" opacity="0.4"/>
        <path d="M34 110 A 50 50 0 0 1 126 110" stroke="#facc15" stroke-width="4" fill="none" opacity="0.4"/>
        <path d="M38 110 A 45 45 0 0 1 122 110" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.4"/>
        <!-- Fluffy Cloud Body -->
        <circle cx="56" cy="80" r="24" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="104" cy="80" r="24" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="80" cy="65" r="28" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2.5"/>
        <rect x="52" y="78" width="56" height="28" rx="14" fill="url(#cloudGrad)"/>
        
        <path d="M66 76 Q72 80 78 76" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 76 Q88 80 94 76" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="80" cy="85" rx="3" ry="2" fill="#1e293b"/>
        <text x="96" y="68" font-family="sans-serif" font-weight="900" font-size="11" fill="#8b5cf6">Z</text>
        <text x="102" y="60" font-family="sans-serif" font-weight="900" font-size="14" fill="#a855f7">Z</text>
        <text x="110" y="52" font-family="sans-serif" font-weight="900" font-size="18" fill="#c084fc">z</text>
      
      </g>
    
</svg>