<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0f9ff"/>
        <stop offset="100%" stop-color="#bae6fd"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Rainbow arch behind -->
        <path d="M30 110 A 55 55 0 0 1 130 110" stroke="#f43f5e" stroke-width="4" fill="none" opacity="0.4"/>
        <path d="M34 110 A 50 50 0 0 1 126 110" stroke="#facc15" stroke-width="4" fill="none" opacity="0.4"/>
        <path d="M38 110 A 45 45 0 0 1 122 110" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.4"/>
        <!-- Fluffy Cloud Body -->
        <circle cx="56" cy="80" r="24" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="104" cy="80" r="24" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="80" cy="65" r="28" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2.5"/>
        <rect x="52" y="78" width="56" height="28" rx="14" fill="url(#cloudGrad)"/>
        
        <circle cx="80" cy="52" r="12" fill="#facc15" stroke="#eab308" stroke-width="2"/>
        <line x1="80" y1="36" x2="80" y2="39" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="66" y1="44" x2="69" y2="46" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="94" y1="44" x2="91" y2="46" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M66 72 Q72 66 78 72" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="88" cy="72" r="3.5" fill="#1e293b"/>
        <path d="M73 82 Q80 88 87 82" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="54" y="98" width="52" height="14" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
        <text x="80" y="109" font-family="sans-serif" font-weight="900" font-size="9" fill="#a16207" text-anchor="middle">MORNING ☀️</text>
      
      </g>
    
</svg>