        <ellipse cx="80" cy="85" rx="54" ry="42" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3.5"/>
        <ellipse cx="80" cy="98" rx="34" ry="24" fill="#bbf7d0" opacity="0.8"/>
        
        <path d="M66 72 Q72 68 78 70" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 70 Q88 68 94 72" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="72" cy="76" r="3.5" fill="#1e293b"/>
