<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="frogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#16a34a"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Frog Body & Big Eyes Top -->
        <circle cx="56" cy="52" r="16" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3"/>
        <circle cx="104" cy="52" r="16" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3"/>
        <ellipse cx="80" cy="85" rx="54" ry="42" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3.5"/>
        <ellipse cx="80" cy="98" rx="34" ry="24" fill="#bbf7d0" opacity="0.8"/>
        
        <path d="M68 66 C62 60 56 68 68 76 C80 68 74 60 68 66 Z" fill="#ef4444"/>
        <path d="M92 66 C86 60 80 68 92 76 C104 68 98 60 92 66 Z" fill="#ef4444"/>
        <path d="M74 83 Q80 90 86 83" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="64" cy="81" r="3.5" fill="#f43f5e" opacity="0.6"/>
        <circle cx="96" cy="81" r="3.5" fill="#f43f5e" opacity="0.6"/>
      
      </g>
    
</svg>