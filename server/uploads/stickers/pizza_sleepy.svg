<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#eab308"/>
      </linearGradient>
      <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#92400e"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Pizza Slice -->
        <path d="M32 45 Q80 32 128 45 L80 135 Z" fill="url(#cheeseGrad)" stroke="#ca8a04" stroke-width="3"/>
        <!-- Crust top -->
        <path d="M30 46 Q80 30 130 46 Q80 20 30 46 Z" fill="url(#crustGrad)" stroke="#78350f" stroke-width="2"/>
        <!-- Pepperonis -->
        <circle cx="58" cy="62" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
        <circle cx="102" cy="62" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
        <circle cx="80" cy="112" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
        
        <path d="M66 80 Q72 84 78 80" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 80 Q88 84 94 80" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="80" cy="89" rx="3" ry="2" fill="#1e293b"/>
        <text x="96" y="72" font-family="sans-serif" font-weight="900" font-size="11" fill="#8b5cf6">Z</text>
        <text x="102" y="64" font-family="sans-serif" font-weight="900" font-size="14" fill="#a855f7">Z</text>
        <text x="110" y="56" font-family="sans-serif" font-weight="900" font-size="18" fill="#c084fc">z</text>
      
      </g>
    
</svg>