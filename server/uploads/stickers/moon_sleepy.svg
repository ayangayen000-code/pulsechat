<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <path d="M52 84 Q58 88 64 84" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M68 84 Q74 88 80 84" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="66" cy="93" rx="3" ry="2" fill="#1e293b"/>
        <text x="82" y="76" font-family="sans-serif" font-weight="900" font-size="11" fill="#8b5cf6">Z</text>
        <text x="88" y="68" font-family="sans-serif" font-weight="900" font-size="14" fill="#a855f7">Z</text>
        <text x="96" y="60" font-family="sans-serif" font-weight="900" font-size="18" fill="#c084fc">z</text>
      
      </g>
    
</svg>