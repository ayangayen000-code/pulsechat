<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Stem -->
        <rect x="74" y="28" width="12" height="20" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2" transform="rotate(-6 80 38)"/>
        <!-- Pumpkin Ribs & Body -->
        <ellipse cx="50" cy="86" rx="28" ry="38" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="2.5"/>
        <ellipse cx="110" cy="86" rx="28" ry="38" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="2.5"/>
        <ellipse cx="80" cy="88" rx="34" ry="42" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="3"/>
        
        <path d="M68 78 Q74 72 80 78" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 78 Q88 72 94 78" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M73 86 Q80 92 87 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="102" cy="100" r="13" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
        <path d="M97 100 L100 104 L107 96" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      </g>
    
</svg>