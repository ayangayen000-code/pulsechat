<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Storm Cloud Body -->
        <circle cx="56" cy="74" r="22" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <circle cx="104" cy="74" r="22" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <circle cx="80" cy="62" r="28" fill="url(#rainGrad)" stroke="#334155" stroke-width="2.5"/>
        <rect x="52" y="70" width="56" height="28" rx="12" fill="url(#rainGrad)"/>
        <!-- Droplets -->
        <ellipse cx="60" cy="116" rx="4" ry="8" fill="#38bdf8"/>
        <ellipse cx="80" cy="122" rx="4" ry="8" fill="#38bdf8"/>
        <ellipse cx="100" cy="116" rx="4" ry="8" fill="#38bdf8"/>
        
        <circle cx="80" cy="46" r="12" fill="#facc15" stroke="#eab308" stroke-width="2"/>
        <line x1="80" y1="30" x2="80" y2="33" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="66" y1="38" x2="69" y2="40" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="94" y1="38" x2="91" y2="40" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M66 66 Q72 60 78 66" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="88" cy="66" r="3.5" fill="#1e293b"/>
        <path d="M73 76 Q80 82 87 76" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="54" y="92" width="52" height="14" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
        <text x="80" y="103" font-family="sans-serif" font-weight="900" font-size="9" fill="#a16207" text-anchor="middle">MORNING ☀️</text>
      
      </g>
    
</svg>