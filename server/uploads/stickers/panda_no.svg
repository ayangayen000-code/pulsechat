        <ellipse cx="80" cy="92" rx="4" ry="3" fill="#0f172a"/>
        
        <line x1="68" y1="70" x2="78" y2="76" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="92" y1="70" x2="82" y2="76" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="72" y1="86" x2="88" y2="86" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="102" cy="96" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
