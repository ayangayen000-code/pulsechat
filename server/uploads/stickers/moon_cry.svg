<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <circle cx="58" cy="84" r="3" fill="#1e293b"/>
        <circle cx="74" cy="84" r="3" fill="#1e293b"/>
        <path d="M58 98 Q66 92 74 98" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M56 86 Q52 102 54 112" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M76 86 Q80 102 78 112" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
      
      </g>
    
</svg>