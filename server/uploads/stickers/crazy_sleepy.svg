        <path d="M42 65 C35 30 75 25 95 38 C120 30 135 60 128 90 C138 120 105 138 80 132 C55 138 25 115 32 85 Z" fill="url(#derpGrad)" stroke="#ca8a04" stroke-width="3.5"/>
        
