        <path d="M82 76 Q88 80 94 76" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse cx="80" cy="85" rx="3" ry="2" fill="#1e293b"/>
        <text x="96" y="68" font-family="sans-serif" font-weight="900" font-size="11" fill="#8b5cf6">Z</text>
