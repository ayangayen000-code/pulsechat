<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>
  
      <g filter="url(#shadow)">
        <path d="M105 58 C126 58 126 92 105 92" fill="none" stroke="#991b1b" stroke-width="8" stroke-linecap="round"/>
        <rect x="42" y="42" width="68" height="72" rx="14" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
        <ellipse cx="76" cy="44" rx="34" ry="10" fill="#450a0a"/>
        <!-- Angry Fire Steam -->
        <path d="M70 30 Q65 14 74 10 Q80 18 78 30" fill="#f97316"/>
        <path d="M85 32 Q92 15 88 12 Q82 20 84 32" fill="#eab308"/>
        <!-- Angry V Eyes -->
        <path d="M54 68 L66 74" stroke="#450a0a" stroke-width="4" stroke-linecap="round"/>
        <path d="M98 68 L86 74" stroke="#450a0a" stroke-width="4" stroke-linecap="round"/>
        <!-- Teeth Gritted -->
        <rect x="64" y="85" width="24" height="10" rx="3" fill="#ffffff" stroke="#450a0a" stroke-width="2"/>
        <line x1="72" y1="85" x2="72" y2="95" stroke="#450a0a" stroke-width="1.5"/>
        <line x1="80" y1="85" x2="80" y2="95" stroke="#450a0a" stroke-width="1.5"/>
        <!-- Warning sign -->
        <polygon points="120,25 135,50 105,50" fill="#facc15" stroke="#000" stroke-width="1.5"/>
        <text x="118" y="46" font-family="sans-serif" font-weight="900" font-size="14" fill="#000">!</text>
      </g>
    
</svg>