<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <path d="M86 52 A 10 10 0 1 0 90 68 A 8 8 0 0 1 86 52 Z" fill="#facc15"/>
        <path d="M52 84 Q58 88 64 84" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M68 84 Q74 88 80 84" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M61 92 Q66 95 71 92" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon points="48,60 50,64 54,65 51,67 52,71 48,68 44,71 45,67 42,65 46,64" fill="#facc15"/>
        <rect x="42" y="106" width="48" height="14" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
        <text x="66" y="117" font-family="sans-serif" font-weight="900" font-size="9" fill="#c7d2fe" text-anchor="middle">NIGHT 🌙</text>
      
      </g>
    
</svg>