<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#eab308"/>
      </linearGradient>
      <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#92400e"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Pizza Slice -->
        <path d="M32 45 Q80 32 128 45 L80 135 Z" fill="url(#cheeseGrad)" stroke="#ca8a04" stroke-width="3"/>
        <!-- Crust top -->
        <path d="M30 46 Q80 30 130 46 Q80 20 30 46 Z" fill="url(#crustGrad)" stroke="#78350f" stroke-width="2"/>
        <!-- Pepperonis -->
        <circle cx="58" cy="62" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
        <circle cx="102" cy="62" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
        <circle cx="80" cy="112" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
        
        <line x1="68" y1="74" x2="78" y2="80" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="92" y1="74" x2="82" y2="80" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="72" y1="90" x2="88" y2="90" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="102" cy="100" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <line x1="97" y1="95" x2="107" y2="105" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="107" y1="95" x2="97" y2="105" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
      </g>
    
</svg>