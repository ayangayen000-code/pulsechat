<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Left Mug (Pink) -->
        <rect x="36" y="50" width="42" height="55" rx="10" fill="#f472b6" stroke="#db2777" stroke-width="2.5"/>
        <ellipse cx="57" cy="50" rx="21" ry="6" fill="#831843"/>
        <circle cx="48" cy="74" r="2.5" fill="#fff"/>
        <circle cx="62" cy="74" r="2.5" fill="#fff"/>
        <path d="M52 82 Q56 86 60 82" stroke="#fff" stroke-width="2" fill="none"/>
        <!-- Right Mug (Blue) -->
        <rect x="74" y="54" width="44" height="52" rx="10" fill="#60a5fa" stroke="#2563eb" stroke-width="2.5"/>
        <ellipse cx="96" cy="54" rx="22" ry="6" fill="#1e3a8a"/>
        <circle cx="86" cy="76" r="2.5" fill="#fff"/>
        <circle cx="102" cy="76" r="2.5" fill="#fff"/>
        <path d="M91 84 Q95 88 99 84" stroke="#fff" stroke-width="2" fill="none"/>
        <!-- Hug arms -->
        <path d="M68 76 C76 72 82 72 88 78" stroke="#db2777" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Love Heart on top -->
        <path d="M76 28 C76 28 70 20 66 23 C62 26 66 32 76 38 C86 32 90 26 86 23 C82 20 76 28 76 28 Z" fill="#ef4444"/>
      </g>
    
</svg>