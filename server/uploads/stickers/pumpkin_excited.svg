<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb923c"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Stem -->
        <rect x="74" y="28" width="12" height="20" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2" transform="rotate(-6 80 38)"/>
        <!-- Pumpkin Ribs & Body -->
        <ellipse cx="50" cy="86" rx="28" ry="38" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="2.5"/>
        <ellipse cx="110" cy="86" rx="28" ry="38" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="2.5"/>
        <ellipse cx="80" cy="88" rx="34" ry="42" fill="url(#pumpkinGrad)" stroke="#c2410c" stroke-width="3"/>
        
        <polygon points="72,70 74,76 80,77 75,80 73,86 70,81 65,82 69,77 67,72 72,75" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
        <polygon points="88,70 90,76 96,77 91,80 89,86 86,81 81,82 85,77 83,72 88,75" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
        <ellipse cx="80" cy="91" rx="8" ry="6" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
        <circle cx="62" cy="84" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="98" cy="84" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="104" cy="62" r="3" fill="#f59e0b"/>
        <circle cx="56" cy="62" r="2" fill="#3b82f6"/>
      
      </g>
    
</svg>