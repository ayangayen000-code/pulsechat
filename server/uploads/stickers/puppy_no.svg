<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="puppyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <ellipse cx="36" cy="76" rx="14" ry="32" fill="#b45309" stroke="#78350f" stroke-width="2.5"/>
        <ellipse cx="124" cy="76" rx="14" ry="32" fill="#b45309" stroke="#78350f" stroke-width="2.5"/>
        <circle cx="80" cy="85" r="44" fill="url(#puppyGrad)" stroke="#d97706" stroke-width="3"/>
        <ellipse cx="80" cy="94" rx="18" ry="14" fill="#fef3c7"/>
        <ellipse cx="80" cy="88" rx="5" ry="3.5" fill="#1e293b"/>
        
        <line x1="68" y1="68" x2="78" y2="74" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="92" y1="68" x2="82" y2="74" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <line x1="72" y1="84" x2="88" y2="84" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="102" cy="94" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
        <line x1="97" y1="89" x2="107" y2="99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="107" y1="89" x2="97" y2="99" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      
      </g>
    
</svg>