<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Spilled Puddle -->
        <ellipse cx="95" cy="115" rx="50" ry="16" fill="#78350f"/>
        <ellipse cx="60" cy="118" rx="20" ry="8" fill="#78350f"/>
        <!-- Tilted Mug -->
        <g transform="rotate(65 70 80)">
          <path d="M95 48 C115 48 115 80 95 80" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round"/>
          <rect x="40" y="35" width="55" height="60" rx="10" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
          <ellipse cx="67" cy="35" rx="27" ry="8" fill="#451a03"/>
          <!-- Crying Face -->
          <circle cx="52" cy="65" r="3" fill="#451a03"/>
          <circle cx="78" cy="65" r="3" fill="#451a03"/>
          <path d="M60 76 Q65 70 70 76" stroke="#451a03" stroke-width="2" fill="none"/>
        </g>
        <!-- Tears / Splash -->
        <circle cx="120" cy="85" r="4" fill="#60a5fa"/>
        <circle cx="132" cy="72" r="3" fill="#60a5fa"/>
        <text x="35" y="42" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ef4444">NOOO!</text>
      </g>
    
</svg>