<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#e0e7ff"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Ghost Sheet with Wavy Hem -->
        <path d="M40 85 C40 45 120 45 120 85 L120 120 Q110 112 100 120 Q90 112 80 120 Q70 112 60 120 Q50 112 40 120 Z" fill="url(#ghostGrad)" stroke="#a5b4fc" stroke-width="3"/>
        <!-- Little floating ghostly hands -->
        <ellipse cx="36" cy="88" rx="8" ry="5" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
        <ellipse cx="124" cy="88" rx="8" ry="5" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
        
        <path d="M100 42 A 10 10 0 1 0 104 58 A 8 8 0 0 1 100 42 Z" fill="#facc15"/>
        <path d="M66 74 Q72 78 78 74" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 74 Q88 78 94 74" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M75 82 Q80 85 85 82" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <polygon points="62,50 64,54 68,55 65,57 66,61 62,58 58,61 59,57 56,55 60,54" fill="#facc15"/>
        <rect x="56" y="96" width="48" height="14" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
        <text x="80" y="107" font-family="sans-serif" font-weight="900" font-size="9" fill="#c7d2fe" text-anchor="middle">NIGHT 🌙</text>
      
      </g>
    
</svg>