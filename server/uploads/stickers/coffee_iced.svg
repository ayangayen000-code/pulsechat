<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="icedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fdba74"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Straw -->
        <path d="M92 12 L78 60" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
        <!-- Clear Cup -->
        <polygon points="46,50 106,50 98,124 54,124" fill="#fed7aa" stroke="#f97316" stroke-width="3" opacity="0.9"/>
        <!-- Ice cubes -->
        <rect x="56" y="60" width="18" height="18" rx="4" fill="#ffffff" opacity="0.6"/>
        <rect x="78" y="70" width="16" height="16" rx="4" fill="#ffffff" opacity="0.6"/>
        <!-- Lid -->
        <path d="M42 50 Q76 40 110 50 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
        <!-- Face -->
        <circle cx="64" cy="94" r="3.5" fill="#7c2d12"/>
        <circle cx="88" cy="94" r="3.5" fill="#7c2d12"/>
        <path d="M72 102 Q76 108 80 102" stroke="#7c2d12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="58" cy="98" r="4" fill="#fb7185" opacity="0.6"/>
        <circle cx="94" cy="98" r="4" fill="#fb7185" opacity="0.6"/>
      </g>
    
</svg>