<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="bearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fcd34d"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Ears -->
        <circle cx="46" cy="50" r="16" fill="url(#bearGrad)" stroke="#b45309" stroke-width="3"/>
        <circle cx="46" cy="50" r="8" fill="#fecdd3"/>
        <circle cx="114" cy="50" r="16" fill="url(#bearGrad)" stroke="#b45309" stroke-width="3"/>
        <circle cx="114" cy="50" r="8" fill="#fecdd3"/>
        <!-- Head -->
        <circle cx="80" cy="85" r="44" fill="url(#bearGrad)" stroke="#b45309" stroke-width="3.5"/>
        <!-- Cream Muzzle -->
        <ellipse cx="80" cy="94" rx="16" ry="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
        <polygon points="76,89 84,89 80,94" fill="#78350f"/>
        
        <line x1="66" y1="66" x2="78" y2="72" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="94" y1="66" x2="82" y2="72" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="72" cy="76" r="3" fill="#1e293b"/>
        <circle cx="88" cy="76" r="3" fill="#1e293b"/>
        <path d="M72 85 L76 83 L80 85 L84 83 L88 85" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M100 56 L108 56 M104 52 L104 60 M101 53 L107 59" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      
      </g>
    
</svg>