<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="teaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Tea Saucer -->
        <ellipse cx="80" cy="115" rx="55" ry="12" fill="#a7f3d0" stroke="#047857" stroke-width="2.5"/>
        <!-- Cup -->
        <path d="M48 55 C48 100 112 100 112 55 Z" fill="url(#teaGrad)" stroke="#064e3b" stroke-width="3"/>
        <ellipse cx="80" cy="55" rx="32" ry="9" fill="#065f46"/>
        <!-- Tea Tag -->
        <path d="M96 58 Q115 65 110 82" fill="none" stroke="#d1fae5" stroke-width="2"/>
        <rect x="105" y="82" width="14" height="16" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
        <!-- Relaxed Eyes -->
        <path d="M64 78 Q70 84 76 78" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M84 78 Q90 84 96 78" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Calm smile -->
        <path d="M76 88 Q80 92 84 88" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- Steam -->
        <path d="M74 42 Q70 30 76 22" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M86 40 Q90 28 84 20" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </g>
    
</svg>