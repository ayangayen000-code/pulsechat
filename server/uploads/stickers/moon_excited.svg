<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#facc15"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Crescent Moon -->
        <path d="M96 28 C60 28 32 60 32 96 C32 132 60 144 96 144 C72 130 64 88 88 56 C96 46 102 38 96 28 Z" fill="url(#moonGrad)" stroke="#ca8a04" stroke-width="3"/>
        
        <polygon points="58,74 60,80 66,81 61,84 59,90 56,85 51,86 55,81 53,76 58,79" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
        <polygon points="74,74 76,80 82,81 77,84 75,90 72,85 67,86 71,81 69,76 74,79" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
        <ellipse cx="66" cy="95" rx="8" ry="6" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
        <circle cx="48" cy="88" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="84" cy="88" r="4" fill="#f43f5e" opacity="0.6"/>
        <circle cx="90" cy="66" r="3" fill="#f59e0b"/>
        <circle cx="42" cy="66" r="2" fill="#3b82f6"/>
      
      </g>
    
</svg>