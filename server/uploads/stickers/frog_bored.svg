<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
      <linearGradient id="frogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#16a34a"/>
      </linearGradient>
    
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Frog Body & Big Eyes Top -->
        <circle cx="56" cy="52" r="16" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3"/>
        <circle cx="104" cy="52" r="16" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3"/>
        <ellipse cx="80" cy="85" rx="54" ry="42" fill="url(#frogGrad)" stroke="#15803d" stroke-width="3.5"/>
        <ellipse cx="80" cy="98" rx="34" ry="24" fill="#bbf7d0" opacity="0.8"/>
        
        <line x1="66" y1="72" x2="78" y2="72" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="70" cy="75" r="2.5" fill="#1e293b"/>
        <line x1="82" y1="72" x2="94" y2="72" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <circle cx="86" cy="75" r="2.5" fill="#1e293b"/>
        <line x1="73" y1="84" x2="87" y2="84" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        <text x="98" y="64" font-family="sans-serif" font-weight="900" font-size="12" fill="#64748b">...</text>
      
      </g>
    
</svg>